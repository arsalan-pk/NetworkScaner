# Development environment configuration
# Overrides base configuration for development environment

app:
  debug: true
  log_level: "DEBUG"

logging:
  level: "DEBUG"
  console: true
  file: "network_scanner_dev.log"

scanning:
  timeout: 120
  default_profile: "quick_scan"

ui:
  window_width: 1000
  window_height: 800

security:
  validate_inputs: true
  # Less strict validation in development
  max_target_length: 500
